<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jail Information Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            margin: 50px auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .form-group button {
            padding: 10px 15px;
            background-color: #28a745;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        .form-group button:hover {
            background-color: #218838;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>

  
    <div class="container">
        <h1>Jail Information Management System</h1>
        
        <!-- Inmate Information Form -->
        <form id="inmateForm">
            <div class="form-group">
                <label for="inmateId">Inmate ID</label>
                <input type="text" id="inmateId" name="inmateId" required>
            </div>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" name="age" required>
            </div>
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="crime">Crime</label>
                <input type="text" id="crime" name="crime" required>
            </div>
            <div class="form-group">
                <label for="sentence">Sentence</label>
                <input type="text" id="sentence" name="sentence" required>
            </div>
            <div class="form-group">
                <label for="cellNumber">Cell Number</label>
                <input type="text" id="cellNumber" name="cellNumber" required>
            </div>
            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea id="notes" name="notes" rows="4"></textarea>
            </div>
            <div class="form-group">
                <button type="submit">Add Inmate</button>
            </div>
        </form>

        <!-- Inmate List Table -->
        <h2>Inmate List</h2>
        <table id="inmateTable">
            <thead>
                <tr>
                    <th>Inmate ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Crime</th>
                    <th>Sentence</th>
                    <th>Cell Number</th>
                    <th>Notes</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Inmate rows will be dynamically added here -->
            </tbody>
        </table>
    </div>

    <script>
        // JavaScript to handle form submission and add inmate to the table
        document.getElementById('inmateForm').addEventListener('submit', function(event) {
            event.preventDefault();

            // Get form values
            const inmateId = document.getElementById('inmateId').value;
            const name = document.getElementById('name').value;
            const age = document.getElementById('age').value;
            const gender = document.getElementById('gender').value;
            const crime = document.getElementById('crime').value;
            const sentence = document.getElementById('sentence').value;
            const cellNumber = document.getElementById('cellNumber').value;
            const notes = document.getElementById('notes').value;

            // Create a new row in the table
            const table = document.getElementById('inmateTable').getElementsByTagName('tbody')[0];
            const newRow = table.insertRow();

            // Insert cells with the form data
            newRow.insertCell(0).textContent = inmateId;
            newRow.insertCell(1).textContent = name;
            newRow.insertCell(2).textContent = age;
            newRow.insertCell(3).textContent = gender;
            newRow.insertCell(4).textContent = crime;
            newRow.insertCell(5).textContent = sentence;
            newRow.insertCell(6).textContent = cellNumber;
            newRow.insertCell(7).textContent = notes;

            // Add a delete button to the row
            const deleteButton = document.createElement('button');
            deleteButton.textContent = 'Delete';
            deleteButton.addEventListener('click', function() {
                table.deleteRow(newRow.rowIndex - 1);
            });
            newRow.insertCell(8).appendChild(deleteButton);

            // Clear the form
            document.getElementById('inmateForm').reset();
        });
    </script>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f4f4;
                margin: 0;
                padding: 0;
            }
            .container {
                width: 80%;
                margin: 50px auto;
                background: #fff;
                padding: 20px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }
            h1, h2 {
                text-align: center;
                color: #333;
            }
            .form-group {
                margin-bottom: 15px;
            }
            .form-group label {
                display: block;
                margin-bottom: 5px;
                color: #333;
            }
            .form-group input, .form-group select, .form-group textarea {
                width: 100%;
                padding: 8px;
                box-sizing: border-box;
            }
            .form-group button {
                padding: 10px 15px;
                background-color: #28a745;
                color: #fff;
                border: none;
                cursor: pointer;
            }
            .form-group button:hover {
                background-color: #218838;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 20px;
            }
            table, th, td {
                border: 1px solid #ddd;
            }
            th, td {
                padding: 10px;
                text-align: left;
            }
            th {
                background-color: #f8f9fa;
            }
            .shift-actions {
                display: flex;
                gap: 5px;
            }
        </style>
    </head>
    </body>
    
</html>
