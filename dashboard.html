<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prison Management System</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* Full-Screen Background */
        body {
            background: url('./image/b.jpeg') no-repeat center center/cover;
            text-align: center;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Navigation Bar */
        .menu {
            background: rgba(44, 62, 80, 0.9);
            padding: 1rem 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            transition: all 0.4s ease-in-out;
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 1.5rem;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        nav a:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .brand::before {
            content: '🔒';
            font-size: 1.8rem;
        }

        .badge {
            background: #e74c3c;
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
            font-size: 0.8rem;
            margin-left: 0.5rem;
            animation: pulse 1.5s infinite;
        }

        /* Main Content Box */
        .content {
            margin-top: 6rem;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            border-radius: 12px;
            max-width: 800px;
            transition: all 0.5s ease-in-out;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s forwards;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 1rem;
            animation: slideIn 1s ease-in-out;
        }

        p {
            font-size: 1.2rem;
            color: #555;
            animation: slideIn 1.5s ease-in-out;
        }

        /* Image Section */
        .swr {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
            opacity: 0;
            animation: fadeIn 1.5s forwards;
        }

        .swr img {
            width: 250px;
            height: 180px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }

        .swr img:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
        }

        /* Animations */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            nav {
                padding: 0 1.5rem;
            }
            .brand {
                font-size: 1.3rem;
            }
            nav ul {
                gap: 1rem;
            }
            .content {
                max-width: 700px;
                margin-top: 5rem;
            }
            .swr img {
                width: 220px;
                height: 160px;
            }
        }

        @media (max-width: 768px) {
            nav ul {
                flex-direction: column;
                gap: 0.8rem;
                text-align: left;
            }
            .content {
                margin-top: 4rem;
                max-width: 100%;
                padding: 1.5rem;
            }
            .swr {
                flex-direction: column;
            }
            .swr img {
                width: 200px;
                height: 150px;
                margin-bottom: 1rem;
            }
        }

        @media (max-width: 480px) {
            nav {
                padding: 1rem;
            }
            .brand {
                font-size: 1.2rem;
            }
            nav a {
                font-size: 1rem;
                padding: 0.6rem 1.2rem;
            }
            .content {
                margin-top: 3rem;
                padding: 1rem;
                max-width: 100%;
            }
            .swr img {
                width: 180px;
                height: 140px;
            }
        }

    </style>
</head>
<body>

<!-- Navigation Bar -->
<div class="menu">
    <nav>
        <span class="brand">PrisonSys</span>
        <ul>
            <li><a href="Dashboard.html" class="active">Dashboard</a></li>
            <li><a href="l.html">Information <span class="badge">3</span></a></li>
            <li><a href="regestration.html">Registration</a></li>
            <li><a href="Commanders.html">Commanders</a></li>
        </ul>
    </nav>
</div>

<!-- Main Content -->
<div class="content">
    <h1>Welcome to the Prison Management System</h1>
    <p>Manage and monitor prison operations efficiently with our system. Navigate through the menu to access different sections.</p>
</div>

<!-- Image Gallery -->
<div class="swr">
    <img src="./image/gacmo.jpeg" alt="Prison Image 1">
    <img src="./image/anther.jpeg" alt="Prison Image 2">
    <img src="./image/gag.jpeg" alt="Prison Image 3">
    <img src="./image/da.jpeg" alt="Prison Image 4">
</div>

</body>
</html>
