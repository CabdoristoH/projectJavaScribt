<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commanders Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            margin: 50px auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1, h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .form-group button {
            padding: 10px 15px;
            background-color: #28a745;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        .form-group button:hover {
            background-color: #218838;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f8f9fa;
        }
        .commander-image {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Commanders Management System</h1>

        <!-- Add/Edit Commander Form -->
        <div class="section">
            <h2 id="formTitle">Add New Commander</h2>
            <form id="commanderForm">
                <div class="form-group">
                    <label for="commanderName">Full Name</label>
                    <input type="text" id="commanderName" name="commanderName" required>
                </div>
                <div class="form-group">
                    <label for="commanderRank">Rank</label>
                    <input type="text" id="commanderRank" name="commanderRank" required>
                </div>
                <div class="form-group">
                    <button type="submit" id="submitCommanderButton">Add Commander</button>
                    <button type="button" id="cancelCommanderButton" style="display: none;">Cancel</button>
                </div>
            </form>
        </div>

        <script>
            let commanders = [];
            let editCommanderIndex = -1;

            document.getElementById('commanderForm').addEventListener('submit', function(event) {
                event.preventDefault();
                const commanderName = document.getElementById('commanderName').value;
                const commanderRank = document.getElementById('commanderRank').value;
                
                const commander = { name: commanderName, rank: commanderRank };
                
                if (editCommanderIndex === -1) {
                    commanders.push(commander);
                } else {
                    commanders[editCommanderIndex] = commander;
                    editCommanderIndex = -1;
                }
                document.getElementById('commanderForm').reset();
            });
        </script>
    </div>
</body>
</html>
